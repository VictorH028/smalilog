[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smalilog"
version = "0.2.0"
description = "Herramienta CLI para análisis e instrumentación Smali y recepción de logs HTTP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich",
    "pydantic>=2.6",
    "aiosqlite>=0.19",
    "platformdirs>=4.2",
    "pydantic-settings>=2.2",
]

[project.scripts]
smalilog = "smalilog.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
